<!DOCTYPE html>
<html>
<head>
<title>OJEWA - Account</title>
<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f5f5f5;
}
header {
  background: #0b6b3a;
  color: white;
  padding: 20px;
  text-align: center;
}
.account {
  background: white;
  margin: 20px;
  padding: 25px;
  border-radius: 10px;
  text-align: center;
}
.account-icon {
  font-size: 70px;
  margin-bottom: 15px;
}
.account a {
  display: block;
  background: #0b6b3a;
  color: white;
  padding: 14px;
  margin: 12px 0;
  border-radius: 8px;
  text-decoration: none;
  font-weight: bold;
}
.sell-button {
  background: #f28c28 !important;
}
.back {
  display: inline-block !important;
  background: none !important;
  color: #0b6b3a !important;
  padding: 0 !important;
  margin-top: 15px !important;
}
.stats {
  background: #eef5ef;
  padding: 12px;
  border-radius: 8px;
  margin: 15px 0;
}
</style>
</head>
<body>
<header>
<h1>OJEWA</h1>
<p>My Account</p>
</header>
<div class="account">
<div class="account-icon">
  👤
</div>
<h2>
  My Account
</h2>
<p>
  Manage your OJEWA marketplace account.
</p>
<div class="stats">
  <strong id="listingCount">
    0
  </strong>
  <br>
  Items Posted
</div>
<!-- SELL ITEM -->
<a
  href="sell.html"
  class="sell-button"
>
  🛍️ Sell an Item
</a>
<!-- MY LISTINGS -->
<a
  href="listings.html"
>
  📋 My Listings
</a>
<!-- FAVOURITES -->
<a
  href="favorites.html"
>
  ❤️ My Favourites
</a>
<!-- MESSAGES -->
<a href="#">
  💬 Messages
</a>
<!-- SETTINGS -->
<a href="#">
  ⚙️ Settings
</a>
<!-- BACK -->
<a
  href="index.html"
  class="back"
>
  ← Back to OJEWA
</a>
</div>
<script>
/* =========================
   COUNT USER LISTINGS
========================= */
const listings =
  JSON.parse(
    localStorage.getItem("ojewaListings")
  ) || [];
document.getElementById(
  "listingCount"
).textContent =
  listings.length;
</script>
</body>
</html>
