<!DOCTYPE html>
<html>
<head>
<title>OJEWA - Favourites</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f5f5f5;
}

header {
  background: #0b6b3a;
  color: white;
  padding: 20px;
  text-align: center;
}

.favourites {
  background: white;
  margin: 20px;
  padding: 20px;
  border-radius: 10px;
  text-align: center;
}

</style>

</head>

<body>

<header>
<h1>OJEWA</h1>
<p>My Favourite Items ❤️</p>
</header>

<div class="favourites">

<h2>No saved items yet</h2>

<p>Your saved products will appear here.</p>

<a href="index.html">Back to OJEWA</a>

</div>
<script>

const favorites =
  JSON.parse(localStorage.getItem("ojewaFavorites")) || [];

const container =
  document.querySelector(".favourites");

if (favorites.length === 0) {

  container.innerHTML = `
    <h2>No saved items yet ❤️</h2>
    <p>Your saved products will appear here.</p>
    <a href="index.html">Back to OJEWA</a>
  `;

} else {

  container.innerHTML = `
    <h2>My Favourite Items ❤️</h2>
    <div id="favoriteList"></div>
    <a href="index.html">Back to OJEWA</a>
  `;

  const list =
    document.getElementById("favoriteList");

  favorites.forEach(function(item, index) {

    list.innerHTML += `
      <div style="
        border:1px solid #ddd;
        padding:15px;
        margin:15px 0;
        border-radius:8px;
      ">

        ${
          item.image
            ? `<img src="${item.image}"
                 style="width:100%;height:200px;object-fit:contain;border-radius:8px;">`
            : `<div style="font-size:60px;">${item.icon || "📦"}</div>`
        }

        <h3>${item.name}</h3>

        <p>
          <strong>GH₵ ${item.price}</strong>
        </p>

        <p>📍 ${item.location}</p>

        <p>${item.description || ""}</p>

        <button onclick="removeFavorite(${index})">
          🗑️ Remove Favourite
        </button>

      </div>
    `;

  });
}

function removeFavorite(index) {

  let favorites =
    JSON.parse(localStorage.getItem("ojewaFavorites")) || [];

  favorites.splice(index, 1);

  localStorage.setItem(
    "ojewaFavorites",
    JSON.stringify(favorites)
  );

  alert("Removed from favourites ❤️");

  location.reload();
}

</script>

</body>
</html>
