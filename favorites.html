<!DOCTYPE html>
<html>
<head>
<title>OJEWA - Favourites</title>
<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f5f5f5;
}
header {
  background: #0b6b3a;
  color: white;
  padding: 20px;
  text-align: center;
}
.favourites {
  background: white;
  margin: 20px;
  padding: 20px;
  border-radius: 14px;
  text-align: center;
}

.favourites h2 {
  color: #18221b;
  font-size: 24px;
  margin: 5px 0 20px;
}

#favoriteList {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
}

.favorite-item {
  border: 1px solid #e1e1e1;
  padding: 10px;
  margin: 0;
  border-radius: 12px;
  background: white;
  text-align: left;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
  overflow: hidden;
}

.favorite-item h3 {
  font-size: 16px;
  margin: 10px 4px 6px;
  color: #18221b;
}

.favorite-item p {
  margin: 6px 4px;
  font-size: 14px;
}

.favorite-item p strong {
  color: #0b6b3a;
  font-size: 17px;
}

.favorite-image {
  width: 100%;
  height: 170px;
  object-fit: contain;
  border-radius: 10px;
  background: #eef5ef;
  display: block;
  margin-bottom: 8px;
}

.favorite-icon {
  width: 100%;
  height: 170px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 55px;
  background: #eef5ef;
  border-radius: 10px;
  margin-bottom: 8px;
}

.view-button {
  display: block;
  background: #0b6b3a;
  color: white;
  padding: 9px 10px;
  border-radius: 6px;
  text-decoration: none;
  font-weight: bold;
  margin-top: 10px;
  text-align: center;
}

.remove-button {
  width: 100%;
  background: #d9534f;
  color: white;
  border: none;
  padding: 9px 8px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
  margin-top: 8px;
  font-size: 13px;
}

.back {
  display: inline-block;
  margin-top: 20px;
  color: #0b6b3a;
  text-decoration: none;
  font-weight: bold;
}
.favorite-item {
  border: 1px solid #ddd;
  padding: 15px;
  margin: 15px 0;
  border-radius: 8px;
  background: white;
}
.favorite-image {
  width: 100%;
  height: 220px;
  object-fit: contain;
  border-radius: 8px;
  background: #eef5ef;
  display: block;
  margin-bottom: 12px;
}
.favorite-icon {
  width: 100%;
  height: 220px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 70px;
  background: #eef5ef;
  border-radius: 8px;
  margin-bottom: 12px;
}
.view-button {
  display: inline-block;
  background: #0b6b3a;
  color: white;
  padding: 10px 18px;
  border-radius: 6px;
  text-decoration: none;
  font-weight: bold;
  margin-top: 8px;
}
.remove-button {
  background: #d9534f;
  color: white;
  border: none;
  padding: 10px 18px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
  margin-top: 8px;
}
.back {
  display: inline-block;
  margin-top: 15px;
  color: #0b6b3a;
  text-decoration: none;
  font-weight: bold;
}
</style>
</head>
<body>
<header>
<h1>OJEWA</h1>
<p>My Favourite Items ❤️</p>
</header>
<div class="favourites">
<div id="favoriteContainer"></div>
</div>
<script>
/* =========================
   GET FAVORITES
========================= */
let favorites =
  JSON.parse(
    localStorage.getItem("ojewaFavorites")
  ) || [];
const container =
  document.getElementById("favoriteContainer");
/* =========================
   NO FAVORITES
========================= */
if (favorites.length === 0) {
  container.innerHTML = `
    <h2>No saved items yet ❤️</h2>
    <p>
      Your saved products will appear here.
    </p>
    <a
      href="index.html"
      class="back"
    >
      ← Back to OJEWA
    </a>
  `;
}
/* =========================
   SHOW FAVORITES
========================= */
else {
  container.innerHTML = `
    <h2>
      My Favourite Items ❤️
    </h2>
    <div id="favoriteList"></div>
    <a
      href="index.html"
      class="back"
    >
      ← Back to OJEWA
    </a>
  `;
  const list =
    document.getElementById("favoriteList");
  favorites.forEach(function(item, index) {
    let imageHTML;
    /* REAL PRODUCT PHOTO */
    if (item.image) {
      imageHTML = `
        <img
          src="${item.image}"
          class="favorite-image"
          alt="${item.name}"
          onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
        >
        <div
          class="favorite-icon"
          style="display:none;"
        >
          ${item.icon || "📦"}
        </div>
      `;
    }
    /* ICON IF THERE IS NO PHOTO */
    else {
      imageHTML = `
        <div class="favorite-icon">
          ${item.icon || "📦"}
        </div>
      `;
    }
    /*
      IMPORTANT:
      Use listing ID first.
      This makes sure a user's uploaded
      listing opens the exact listing.
    */
    let productLink;
    if (item.id) {
      productLink =
        "product.html?listing=" +
        encodeURIComponent(item.id);
    }
    else {
      productLink =
        "product.html?item=" +
        encodeURIComponent(item.item || "");
    }
    list.innerHTML += `
      <div class="favorite-item">
        <a
          href="${productLink}"
        >
          ${imageHTML}
        </a>
        <h3>
          ${item.name || "Product"}
        </h3>
        <p>
          <strong>
            ${formatPrice(item.price)}
          </strong>
        </p>
        <p>
          📍 ${item.location || "Location not specified"}
        </p>
        <p>
          ${item.description || ""}
        </p>
        <a
          href="${productLink}"
          class="view-button"
        >
          View Product
        </a>
        <br>
        <button
          class="remove-button"
          onclick="removeFavorite(${index})"
        >
          🗑️ Remove Favourite
        </button>
      </div>
    `;
  });
}
/* =========================
   PRICE FORMAT
========================= */
function formatPrice(price) {
  if (!price) {
    return "Price not specified";
  }
  const text =
    String(price).trim();
  if (text.startsWith("GH₵")) {
    return text;
  }
  return "GH₵ " + text;
}
/* =========================
   REMOVE FAVORITE
========================= */
function removeFavorite(index) {
  let favorites =
    JSON.parse(
      localStorage.getItem("ojewaFavorites")
    ) || [];
  favorites.splice(index, 1);
  localStorage.setItem(
    "ojewaFavorites",
    JSON.stringify(favorites)
  );
  alert(
    "Removed from favourites ❤️"
  );
  location.reload();
}
</script>
</body>
</html>
