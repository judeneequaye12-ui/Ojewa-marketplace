<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OJEWA - Messages</title>
<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f5f5f5;
  color: #18221b;
}
header {
  background: #0b6b3a;
  color: white;
  padding: 20px;
  text-align: center;
}
.container {
  max-width: 600px;
  margin: 20px auto;
  padding: 15px;
}
.messages-box {
  background: white;
  border-radius: 12px;
  padding: 20px;
}
.message-card {
  background: #f8faf8;
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 15px;
  margin-bottom: 12px;
  cursor: pointer;
}
.message-card:active {
  transform: scale(0.99);
}
.message-product {
  font-size: 17px;
  font-weight: bold;
  color: #0b6b3a;
  margin-bottom: 8px;
}
.message-text {
  font-size: 15px;
  margin-bottom: 8px;
}
.message-date {
  font-size: 12px;
  color: #777;
}
.empty-messages {
  text-align: center;
  padding: 40px 15px;
  color: #777;
}
.back {
  display: block;
  text-align: center;
  margin-top: 20px;
  color: #0b6b3a;
  text-decoration: none;
  font-weight: bold;
}
</style>
</head>
<body>
<header>
  <h1>OJEWA</h1>
  <p>Messages 💬</p>
</header>
<div class="container">
  <div class="messages-box">
<h2 style="margin-top:0;">
  Your Messages
</h2>
<div id="messagesList">
</div>
  </div>

<a
href=“account.html”
class=“back”

← Back to Account
  </a>
</div>
<script>
/* =========================
   LOAD SAVED MESSAGES
========================= */
function loadMessages() {
  const messagesList =
    document.getElementById(
      "messagesList"
    );
  const messages =
    JSON.parse(
      localStorage.getItem(
        "ojewaMessages"
      )
    ) || [];
  /* =========================
     NO MESSAGES
  ========================= */
  if (
    messages.length === 0
  ) {
    messagesList.innerHTML = `
      <div class="empty-messages">
        <div style="font-size:50px;">
          💬
        </div>
        <h3>
          No messages yet
        </h3>
        <p>
          Your conversations will appear here.
        </p>
      </div>
    `;
    return;
  }
  /* =========================
     SHOW MESSAGES
  ========================= */
  messagesList.innerHTML = "";
  messages
    .slice()
    .reverse()
    .forEach(
      function(message) {
        const card =
          document.createElement(
            "div"
          );
        card.className =
          "message-card";
        const productName =
          message.productName ||
          "OJEWA Item";
        const text =
          message.text ||
          "";
        const date =
          message.date ||
          "";
        card.innerHTML = `
          <div class="message-product">
            💬 ${productName}
          </div>
          <div class="message-text">
            ${text}
          </div>
          <div class="message-date">
            ${date}
          </div>
        `;
        /* =========================
           OPEN CONVERSATION
        ========================= */
        card.onclick =
          function() {
            if (
              message.listingId
            ) {
              window.location.href =
                "conversation.html?listing=" +
                encodeURIComponent(
                  message.listingId
                );
              return;
            }
            if (
              message.itemKey
            ) {
              window.location.href =
                "conversation.html?item=" +
                encodeURIComponent(
                  message.itemKey
                );
              return;
            }
            window.location.href =
              "conversation.html";
          };
        messagesList.appendChild(
          card
        );
      }
    );
}
/* =========================
   START
========================= */
loadMessages();
</script>
</body>
</html>
