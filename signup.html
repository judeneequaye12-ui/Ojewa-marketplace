<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OJEWA - Sign Up</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f5f5f5;
  color: #18221b;
}

header {
  background: #0b6b3a;
  color: white;
  padding: 20px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 30px;
}

header p {
  margin: 6px 0 0;
}

.signup-box {
  background: white;
  max-width: 420px;
  margin: 35px auto;
  padding: 25px;
  border-radius: 12px;
  box-sizing: border-box;
}

.signup-icon {
  text-align: center;
  font-size: 60px;
  margin-bottom: 10px;
}

h2 {
  text-align: center;
  margin-bottom: 8px;
}

.subtitle {
  text-align: center;
  color: #666;
  margin-bottom: 25px;
}

label {
  display: block;
  font-weight: bold;
  margin-top: 15px;
  margin-bottom: 7px;
}

input {
  width: 100%;
  padding: 13px;
  border: 1px solid #ccc;
  border-radius: 8px;
  box-sizing: border-box;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 22px;
  background: #0b6b3a;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  opacity: 0.9;
}

.login-link {
  text-align: center;
  margin-top: 20px;
}

.login-link a {
  color: #0b6b3a;
  font-weight: bold;
  text-decoration: none;
}

.back {
  display: block;
  text-align: center;
  margin-top: 20px;
  color: #0b6b3a;
  text-decoration: none;
}

@media (max-width: 480px) {
  .signup-box {
    margin: 25px 15px;
  }
}
</style>
</head>

<body>

<header>
  <h1>OJEWA</h1>
  <p>BUY • SELL • CONNECT</p>
</header>

<div class="signup-box">

  <div class="signup-icon">
    👤
  </div>

  <h2>Create Your Account</h2>

  <p class="subtitle">
    Join the OJEWA marketplace
  </p>

  <form onsubmit="signupDemo(event)">

    <label for="name">
      Full Name
    </label>

    <input
      type="text"
      id="name"
      placeholder="Enter your full name"
      required
    >

    <label for="email">
      Email
    </label>

    <input
      type="email"
      id="email"
      placeholder="Enter your email"
      required
    >

    <label for="password">
      Password
    </label>

    <input
      type="password"
      id="password"
      placeholder="Create a password"
      required
    >

    <button type="submit">
      Create Account
    </button>

  </form>

  <div class="login-link">
    Already have an account?
    <a href="login.html">
      Login
    </a>
  </div>

  <a href="index.html" class="back">
    ← Back to OJEWA
  </a>

</div>

<script>

function signupDemo(event) {

  event.preventDefault();

  alert(
    "Account registration is not connected yet. We will connect it to the OJEWA online account system in the next step."
  );

}

</script>

</body>
</html>
