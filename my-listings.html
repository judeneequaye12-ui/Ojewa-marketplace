<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>OJEWA - My Listings</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f5f5f5;
  color: #18221b;
}

header {
  background: #0b6b3a;
  color: white;
  padding: 20px;
  text-align: center;
}

header h1 {
  margin: 0;
}

.container {
  padding: 20px;
}

h2 {
  text-align: center;
}

.listings {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 15px;
}

.listing {
  background: white;
  padding: 18px;
  border-radius: 12px;
  border: 1px solid #ddd;
}

.listing-content {
  cursor: pointer;
}

.pic {
  height: 130px;
  background: #eef5ef;
  border-radius: 10px;
  display: grid;
  place-items: center;
  font-size: 50px;
}

.listing h3 {
  margin-bottom: 8px;
}

.price {
  color: #0b6b3a;
  font-size: 20px;
  font-weight: bold;
}

.category {
  color: #f28c28;
  font-weight: bold;
  font-size: 13px;
}

.delete {
  width: 100%;
  padding: 11px;
  margin-top: 12px;
  background: #d9534f;
  color: white;
  border: none;
  border-radius: 7px;
  font-weight: bold;
}

.back {
  display: block;
  text-align: center;
  margin: 25px 0;
  color: #0b6b3a;
  text-decoration: none;
  font-weight: bold;
}

.empty {
  background: white;
  padding: 35px 20px;
  border-radius: 12px;
  text-align: center;
}
</style>
</head>

<body>

<header>
  <h1>OJEWA</h1>
  <p>My Listings</p>
</header>

<div class="container">

  <h2>Your Listings</h2>

  <div id="listings" class="listings"></div>

  <a href="sell.html" class="back">
    + Post Another Item
  </a>

  <a href="index.html" class="back">
    ← Back to OJEWA
  </a>

</div>

<script>

function getIcon(category) {

  if (category === "Phones & Tablets") return "📱";
  if (category === "Computers") return "💻";
  if (category === "Cars & Vehicles") return "🚗";
  if (category === "Tyres & Wheels") return "🛞";
  if (category === "Property") return "🏠";
  if (category === "Fashion") return "👗";
  if (category === "Home & Living") return "🛋️";
  if (category === "Electronics") return "📺";
  if (category === "Jobs & Services") return "🔧";

  return "📦";
}


function openListing(id) {

  window.location.href =
    "product.html?listing=" + id;

}


function displayListings() {

  const container =
    document.getElementById("listings");

  const listings =
    JSON.parse(localStorage.getItem("ojewaListings")) || [];


  if (listings.length === 0) {

    container.innerHTML = `
      <div class="empty">
        <h3>No listings yet</h3>
        <p>Post your first item on OJEWA.</p>
      </div>
    `;

    return;
  }


  container.innerHTML = "";


  listings.forEach(function(item) {

    const card = document.createElement("div");

    card.className = "listing";

    card.innerHTML = `

      <div
        class="listing-content"
        onclick="openListing(${item.id})">

        <div class="pic">
          ${getIcon(item.category)}
        </div>

        <p class="category">
          ${item.category}
        </p>

        <h3>${item.name}</h3>

        <p class="price">
          ${item.price}
        </p>

        <p>
          📍 ${item.location}
        </p>

        <p>
          ${item.description}
        </p>

        <small>
          Posted: ${item.date}
        </small>

      </div>

      <button
        class="delete"
        onclick="deleteListing(${item.id})">
        Delete Listing
      </button>

    `;

    container.appendChild(card);

  });

}


function deleteListing(id) {

  if (!confirm("Delete this listing?")) {
    return;
  }


  let listings =
    JSON.parse(localStorage.getItem("ojewaListings")) || [];


  listings =
    listings.filter(function(item) {
      return item.id !== id;
    });


  localStorage.setItem(
    "ojewaListings",
    JSON.stringify(listings)
  );


  displayListings();

}


displayListings();

</script>

</body>
</html>
