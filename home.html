<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OJEWA - Home & Living</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }
    header {
      background: #0b6b3a;
      color: white;
      padding: 20px;
      text-align: center;
    }
    header h1 {
      margin: 0;
    }
    .back {
      display: block;
      margin: 15px;
      color: #0b6b3a;
      text-decoration: none;
      font-weight: bold;
    }
    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 15px;
      padding: 15px;
    }
    .product {
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      text-align: center;
    }
    .pic {
      width: 100%;
      height: 150px;
      background: #eeeeee;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 55px;
      margin-bottom: 10px;
      overflow: hidden;
    }
    .pic img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .product h3 {
      margin: 8px 0;
    }
    .price {
      color: #0b6b3a;
      font-weight: bold;
      font-size: 18px;
    }
    .location {
      color: #666;
    }
  </style>
</head>
<body>
<header>
  <h1>🏠 Home & Living</h1>
  <p>Find furniture and home items on OJEWA</p>
</header>
<a class="back" href="categories.html">← Back to Categories</a>
<section class="products">
  <div class="product">
    <div class="pic">
      <img src="https://images.unsplash.com/photo-1555041469-a586c61ea9bc?auto=format&fit=crop&w=600&q=80" alt="Sofa Set">
    </div>
    <h3>Sofa Set</h3>
    <p class="price">GH₵ 3,500</p>
    <p>Used</p>
    <p class="location">📍 Accra</p>
  </div>
  <div class="product">
    <div class="pic">
      <img src="https://images.unsplash.com/photo-1618220179428-22790b461013?auto=format&fit=crop&w=600&q=80" alt="Home Interior">
    </div>
    <h3>Home Furniture</h3>
    <p class="price">GH₵ 4,500</p>
    <p>New</p>
    <p class="location">📍 Tema</p>
  </div>
  <div class="product">
    <div class="pic">
      <img src="https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?auto=format&fit=crop&w=600&q=80" alt="Bedroom">
    </div>
    <h3>Modern Bed</h3>
    <p class="price">GH₵ 2,500</p>
    <p>New</p>
    <p class="location">📍 Kumasi</p>
  </div>
  <div class="product">
    <div class="pic">
      <img src="https://images.unsplash.com/photo-1556912167-f556f1f39fdf?auto=format&fit=crop&w=600&q=80" alt="Kitchen">
    </div>
    <h3>Kitchen Furniture</h3>
    <p class="price">GH₵ 3,000</p>
    <p>New</p>
    <p class="location">📍 Accra</p>
  </div>
</section>
</body>
</html>
