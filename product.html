<!DOCTYPE html>
<html>
<head>
<title>OJEWA - Product Details</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f5f5f5;
}

header {
  background: #0b6b3a;
  color: white;
  padding: 20px;
  text-align: center;
}

.product-details {
  background: white;
  margin: 20px;
  padding: 25px;
  border-radius: 10px;
  text-align: center;
}

.pic {
  font-size: 80px;
  margin-bottom: 15px;
}

.price {
  color: green;
  font-size: 22px;
  font-weight: bold;
}

.info {
  text-align: left;
  margin-top: 20px;
}

.contact {
  display: inline-block;
  background: #0b6b3a;
  color: white;
  padding: 14px 25px;
  border-radius: 8px;
  text-decoration: none;
  margin-top: 20px;
  font-weight: bold;
  font-size: 16px;
}
</style>

</head>

<body>

<header>
<h1>OJEWA</h1>
<p>Product Details</p>
</header>

<div class="product-details">

<div class="pic" id="productIcon">📦</div>

<h2 id="productName">Product</h2>

<p class="price" id="productPrice">GH₵ 0</p>

<div class="info">
<p><strong>Condition:</strong> <span id="productCondition">Not specified</span></p>
<p><strong>Location:</strong> <span id="productLocation">Not specified</span></p>
<p><strong>Description:</strong> <span id="productDescription">No description available.</span></p>
</div>

<a href="index.html" class="contact">Back to OJEWA</a>

</div>

<script>
const products = {
  iphone: {
    icon: "📱",
    name: "iPhone 11 Pro Max",
    price: "GH₵ 3,500",
    condition: "Used - Good condition",
    location: "Accra",
    description: "iPhone 11 Pro Max in good condition."
  },

  samsung: {
    icon: "📱",
    name: "Samsung Galaxy Phone",
    price: "GH₵ 2,500",
    condition: "New",
    location: "Tema",
    description: "New Samsung Galaxy phone."
  },

  toyota: {
    icon: "🚗",
    name: "Toyota Corolla",
    price: "GH₵ 65,000",
    condition: "Used - Good condition",
    location: "Accra",
    description: "Toyota Corolla in good condition."
  },

  hyundai: {
    icon: "🚗",
    name: "Hyundai Elantra",
    price: "GH₵ 55,000",
    condition: "Used",
    location: "Tema",
    description: "Used Hyundai Elantra."
  },

  tyres: {
  icon: "🛞",
  name: "Car Tyres Set",
  price: "GH₵ 1,200",
  condition: "New tyres - Good quality",
  location: "Accra",
  description: "New car tyres set in good quality."
},

alloy: {
  icon: "🛞",
  name: "Alloy Wheels",
  price: "GH₵ 2,000",
  condition: "Used - Excellent condition",
  location: "Tema",
  description: "Used alloy wheels in excellent condition."
},

smarttv: {
  icon: "📺",
  name: "Smart TV",
  price: "GH₵ 3,000",
  condition: "New - High quality display",
  location: "Accra",
  description: "New Smart TV with high quality display."
},
laptop: {
  icon: "💻",
  name: "Laptop Computer",
  price: "GH₵ 4,800",
  condition: "Used - Good condition",
  location: "East Legon",
  description: "Laptop computer in good condition."
},

shirt: {
  icon: "👕",
  name: "Men's Shirt",
  price: "GH₵ 150",
  condition: "New - Quality material",
  location: "Accra",
  description: "Men's shirt made with quality material."
},

dress: {
  icon: "👗",
  name: "Women's Dress",
  price: "GH₵ 250",
  condition: "New - Stylish design",
  location: "Tema",
  description: "Women's dress with a stylish design."
},

sofa: {
  icon: "🛋️",
  name: "Sofa Set",
  price: "GH₵ 3,500",
  condition: "Quality furniture - Good condition",
  location: "Accra",
  description: "Quality sofa set in good condition."
}
};

const params = new URLSearchParams(window.location.search);
const item = params.get("item");

const product = products[item];

if (product) {
  document.getElementById("productIcon").textContent = product.icon;
  document.getElementById("productName").textContent = product.name;
  document.getElementById("productPrice").textContent = product.price;
  document.getElementById("productCondition").textContent = product.condition;
  document.getElementById("productLocation").textContent = product.location;
  document.getElementById("productDescription").textContent = product.description;
} else {
  document.getElementById("productName").textContent = "Product not found";
}
</script>

</body>
</html>
