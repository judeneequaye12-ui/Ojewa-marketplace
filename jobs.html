<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OJEWA - Jobs & Services</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }
    header {
      background: #0b6b3a;
      color: white;
      padding: 20px;
      text-align: center;
    }
    header h1 {
      margin: 0;
    }
    .back {
      display: block;
      margin: 15px;
      color: #0b6b3a;
      text-decoration: none;
      font-weight: bold;
    }
    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 15px;
      padding: 15px;
    }
    .product {
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      text-align: center;
    }
    .pic {
      width: 100%;
      height: 150px;
      background: #eeeeee;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .pic img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .product h3 {
      margin: 8px 0;
    }
    .price {
      color: #0b6b3a;
      font-weight: bold;
      font-size: 18px;
    }
    .location {
      color: #666;
    }
  </style>
</head>
<body>
<header>
  <h1>🔧 Jobs & Services</h1>
  <p>Find trusted services on OJEWA</p>
</header>
<a class="back" href="categories.html">← Back to Categories</a>
<section class="products">
  <div class="product">
    <div class="pic">
      <img src="https://images.unsplash.com/photo-1621905252507-b35492cc74b4?auto=format&fit=crop&w=600&q=80" alt="Electrician">
    </div>
    <h3>Electrician</h3>
    <p class="price">GH₵ 300</p>
    <p>Electrical Services</p>
    <p class="location">📍 Accra</p>
  </div>
  <div class="product">
    <div class="pic">
      <img src="https://images.unsplash.com/photo-1581578731548-c64695cc6952?auto=format&fit=crop&w=600&q=80" alt="Cleaning Service">
    </div>
    <h3>Cleaning Service</h3>
    <p class="price">GH₵ 200</p>
    <p>Home Cleaning</p>
    <p class="location">📍 Tema</p>
  </div>
  <div class="product">
    <div class="pic">
      <img src="https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?auto=format&fit=crop&w=600&q=80" alt="Graphic Designer">
    </div>
    <h3>Graphic Designer</h3>
    <p class="price">GH₵ 500</p>
    <p>Design Services</p>
    <p class="location">📍 Kumasi</p>
  </div>
  <div class="product">
    <div class="pic">
      <img src="https://images.unsplash.com/photo-1556761175-b413da4baf72?auto=format&fit=crop&w=600&q=80" alt="Business Services">
    </div>
    <h3>Business Services</h3>
    <p class="price">GH₵ 400</p>
    <p>Professional Services</p>
    <p class="location">📍 Accra</p>
  </div>
</section>
</body>
</html>
