    .categories {

    }

      text-align: center;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      font-size: 17px;
      cursor: pointer;
    }

    .category:hover {
      transform: translateY(-3px);
    }

    .back {
      display: inline-block;
      margin-bottom: 20px;
      text-decoration: none;
      color: #1a73e8;
      font-weight: bold;
    }
  </style>
</head>
