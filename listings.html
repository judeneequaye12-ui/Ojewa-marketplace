<!DOCTYPE html>
<html>
<head>
<title>OJEWA - My Listings</title>
<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f5f5f5;
}
header {
  background: #0b6b3a;
  color: white;
  padding: 20px;
  text-align: center;
}
.listings {
  background: white;
  margin: 20px;
  padding: 25px;
  border-radius: 10px;
  text-align: center;
}
.listing {
  border: 1px solid #ddd;
  padding: 15px;
  margin: 15px 0;
  border-radius: 8px;
}
.pic-link {
  display: block;
  width: 100%;
  text-decoration: none;
}
.pic {
  width: 100%;
  height: 220px;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  border-radius: 8px;
  background: #eef5ef;
}
.pic img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}.status-active {
  display: inline-block;
  margin-top: 10px;
  background: #e8f5e9;
  color: #0b6b3a;
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: bold;
}
.view-details {
  display: inline-block;
  margin-top: 10px;
  background: #0b6b3a;
  color: white;
  padding: 10px 18px;
  border-radius: 6px;
  font-weight: bold;
  text-decoration: none;
}
.back {
  display: inline-block;
  margin-top: 15px;
  color: #0b6b3a;
  text-decoration: none;
}

.listing-actions {
  margin-top: 15px;
  display: flex;
  gap: 10px;
  justify-content: center;
}

.edit-btn,
.delete-btn {
  border: none;
  padding: 10px 18px;
  border-radius: 6px;
  font-weight: bold;
  cursor: pointer;
  font-size: 14px;
}

.edit-btn {
  background: #f28c28;
  color: white;
}

.delete-btn {
  background: #c62828;
  color: white;
}
</style>
</head>
<body>
<header>
  <h1>OJEWA</h1>
  <p>My Listings</p>
</header>
<div class="listings">
  <h2>Your Listings</h2>
  <div id="myListings"></div>
</div>
<script>
const listings =
  JSON.parse(localStorage.getItem("ojewaListings")) || [];
const container =
  document.getElementById("myListings");
if (listings.length === 0) {
  container.innerHTML = `
    <div class="listing">
      <div class="pic">
        📦
      </div>
      <h3>No listings yet</h3>
      <p>
        Your products will appear here when you post them.
      </p>
    </div>
  `;
} else {
  listings.forEach(item => {
    const listingLink =
      "product.html?listing=" +
      encodeURIComponent(item.id);
    const imageHTML = item.image
      ? `
        <img
          src="${item.image}"
          alt="${item.name}"
          onerror="this.style.display='none'; this.parentElement.innerHTML='📦';"
        >
      `
      : "📦";
    container.innerHTML += `
      <div class="listing">
        <a
          href="${listingLink}"
          class="pic-link"
        >
          <div class="pic">
            ${imageHTML}
          </div>
        </a>
        <h3>
          ${item.name}
        </h3>
        <p>
          <strong>
            ${item.price.startsWith("GH₵")
              ? item.price
              : "GH₵ " + item.price}
          </strong>
        </p>
        <p>
          📍 ${item.location}
        </p>
        <p>
          ${item.description}
        </p>
        <small>
  Posted: ${item.date}
</small>

<br>

<span class="status-active">
  🟢 Active
</span>

<br>

<a
          href="${listingLink}"
          class="view-details"
        >
          View Details
        </a>        <div class="listing-actions">
          <button
            class="edit-btn"
            onclick="editListing(${item.id})"
          >
            Edit
          </button>

          <button
            class="delete-btn"
            onclick="deleteListing(${item.id})"
          >
            Delete
          </button>
        </div>
      </div>
    `;
    });
}

function deleteListing(id) {
  const confirmDelete =
    confirm("Are you sure you want to delete this listing?");

  if (!confirmDelete) {
    return;
  }

  let listings =
    JSON.parse(localStorage.getItem("ojewaListings")) || [];

  listings = listings.filter(function(item) {
    return item.id != id;
  });

  localStorage.setItem(
    "ojewaListings",
    JSON.stringify(listings)
  );

  alert("Listing deleted successfully.");

  location.reload();
}


function editListing(id) {
  window.location.href =
    "sell.html?edit=" + encodeURIComponent(id);
}
</script>
<a
  href="account.html"
  class="back"
>
  ← Back to Account
</a>
</body>
</html>
