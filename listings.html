<!DOCTYPE html>
<html>
<head>
<title>OJEWA - My Listings</title>
<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f5f5f5;
}
header {
  background: #0b6b3a;
  color: white;
  padding: 20px;
  text-align: center;
}
.listings {
  background: white;
  margin: 20px;
  padding: 25px;
  border-radius: 10px;
  text-align: center;
}
.listing {
  border: 1px solid #ddd;
  padding: 15px;
  margin: 15px 0;
  border-radius: 8px;
}
.pic-link {
  display: block;
  width: 100%;
  text-decoration: none;
}
.pic {
  width: 100%;
  height: 220px;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  border-radius: 8px;
  background: #eef5ef;
}
.pic img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.view-details {
  display: inline-block;
  margin-top: 10px;
  background: #0b6b3a;
  color: white;
  padding: 10px 18px;
  border-radius: 6px;
  font-weight: bold;
  text-decoration: none;
}
.back {
  display: inline-block;
  margin-top: 15px;
  color: #0b6b3a;
  text-decoration: none;
}
</style>
</head>
<body>
<header>
  <h1>OJEWA</h1>
  <p>My Listings</p>
</header>
<div class="listings">
  <h2>Your Listings</h2>
  <div id="myListings"></div>
</div>
<script>
const listings =
  JSON.parse(localStorage.getItem("ojewaListings")) || [];
const container =
  document.getElementById("myListings");
if (listings.length === 0) {
  container.innerHTML = `
    <div class="listing">
      <div class="pic">
        📦
      </div>
      <h3>No listings yet</h3>
      <p>
        Your products will appear here when you post them.
      </p>
    </div>
  `;
} else {
  listings.forEach(item => {
    const listingLink =
      "product.html?listing=" +
      encodeURIComponent(item.id);
    const imageHTML = item.image
      ? `
        <img
          src="${item.image}"
          alt="${item.name}"
          onerror="this.style.display='none'; this.parentElement.innerHTML='📦';"
        >
      `
      : "📦";
    container.innerHTML += `
      <div class="listing">
        <a
          href="${listingLink}"
          class="pic-link"
        >
          <div class="pic">
            ${imageHTML}
          </div>
        </a>
        <h3>
          ${item.name}
        </h3>
        <p>
          <strong>
            ${item.price.startsWith("GH₵")
              ? item.price
              : "GH₵ " + item.price}
          </strong>
        </p>
        <p>
          📍 ${item.location}
        </p>
        <p>
          ${item.description}
        </p>
        <small>
          Posted: ${item.date}
        </small>
        <br>
        <a
          href="${listingLink}"
          class="view-details"
        >
          View Details
        </a>
      </div>
    `;
  });
}
</script>
<a
  href="account.html"
  class="back"
>
  ← Back to Account
</a>
</body>
</html>
