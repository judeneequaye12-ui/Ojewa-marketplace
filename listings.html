<!DOCTYPE html>
<html>
<head>
<title>OJEWA - My Listings</title>
<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f5f5f5;
}
header {
  background: #0b6b3a;
  color: white;
  padding: 20px;
  text-align: center;
}
.listings {
  background: white;
  margin: 20px;
  padding: 25px;
  border-radius: 10px;
  text-align: center;
}

.listings-title {
  color: #0b6b3a;
  margin-bottom: 20px;
  font-size: 24px;
}
.listing {
  border: 1px solid #ddd;
  padding: 18px;
  margin: 18px 0;
  border-radius: 12px;
  background: #ffffff;
  box-shadow: 0 3px 10px rgba(0, 0, 0, 0.06);
}
.pic-link {
  display: block;
  width: 100%;
  text-decoration: none;
}
.pic {
  width: 100%;
  height: 220px;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  border-radius: 8px;
  background: #eef5ef;
}
.pic img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}.status-active {
  display: inline-block;
  margin-top: 10px;
  background: #e8f5e9;
  color: #0b6b3a;
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: bold;
}
.view-details {
  display: inline-block;
  margin-top: 10px;
  background: #0b6b3a;
  color: white;
  padding: 10px 18px;
  border-radius: 6px;
  font-weight: bold;
  text-decoration: none;
}
.back {
  display: inline-block;
  margin-top: 15px;
  color: #0b6b3a;
  text-decoration: none;
}

.listing-actions {
  margin-top: 15px;
  display: flex;
  gap: 10px;
  justify-content: center;
}

.edit-btn,
.delete-btn {
  border: none;
  padding: 10px 18px;
  border-radius: 6px;
  font-weight: bold;
  cursor: pointer;
  font-size: 14px;
}

.edit-btn {
  background: #f28c28;
  color: white;
}

.delete-btn {
  background: #c62828;
  color: white;
}
</style>
</head>
<body>
<header>
  <h1>OJEWA</h1>
  <p>My Listings</p>
</header>
<div class="listings">
  <h2 class="listings-title">Your Listings</h2>
  <div id="myListings"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* =========================
   SUPABASE CONNECTION
========================= */
const SUPABASE_URL =
  "https://ywzybrglgwyxewuyfpil.supabase.co";
const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_d_ijgSVbgDi9MnkPtXuJcQ_5GcjKp1T";
const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );
/* =========================
   GET CURRENT USER
========================= */
async function getCurrentUser() {
  const {
    data,
    error
  } =
    await supabaseClient.auth.getUser();
  if (error) {
    console.log(
      "Could not get current user:",
      error
    );
    return null;
  }
  return data.user || null;
}
/* =========================
   LOAD MY LISTINGS
========================= */
async function loadListings() {
  const allListings =
    JSON.parse(
      localStorage.getItem("ojewaListings")
    ) || [];
  const currentUser =
    await getCurrentUser();
  const container =
    document.getElementById("myListings");
  /* =========================
     KEEP EXISTING LISTINGS SAFE
  ========================= */
  let listings;

if (currentUser) {
  listings = allListings.filter(function(item) {
    return !item.userId || item.userId === currentUser.id;
  });
} else {
  listings = allListings;
}
  /* =========================
     NO LISTINGS
  ========================= */
  if (listings.length === 0) {
    container.innerHTML = `
      <div class="listing">
        <div class="pic">
          📦
        </div>
        <h3>No listings yet</h3>
        <p>
          Your products will appear here when you post them.
        </p>
      </div>
    `;
    return;
  }
  /* =========================
     DISPLAY LISTINGS
  ========================= */
  listings.forEach(function(item) {
    const listingLink =
      "product.html?listing=" +
      encodeURIComponent(item.id);
    const imageHTML =
      item.image
        ? `
          <img
            src="${item.image}"
            alt="${item.name}"
            onerror="this.style.display='none'; this.parentElement.innerHTML='📦';"
          >
        `
        : "📦";
    container.innerHTML += `
      <div class="listing">
        <a
          href="${listingLink}"
          class="pic-link"
        >
          <div class="pic">
            ${imageHTML}
          </div>
        </a>
        <h3>
          ${item.name}
        </h3>
        <p>
          <strong>
            ${
              item.price.startsWith("GH₵")
                ? item.price
                : "GH₵ " + item.price
            }
          </strong>
        </p>
        <p>
          📍 ${item.location}
        </p>
        <p>
          ${item.description}
        </p>
        <small>
          Posted: ${item.date}
        </small>
        <br>
        <span class="status-active">
          🟢 Active
        </span>
        <br>
        <a
          href="${listingLink}"
          class="view-details"
        >
          View Details
        </a>
        <div class="listing-actions">
          <button
            class="edit-btn"
            onclick="editListing(${item.id})"
          >
            Edit
          </button>
          <button
            class="delete-btn"
            onclick="deleteListing(${item.id})"
          >
            Delete
          </button>
        </div>
      </div>
    `;
  });
}
/* =========================
   DELETE LISTING
========================= */
function deleteListing(id) {
  const confirmDelete =
    confirm(
      "Are you sure you want to delete this listing?"
    );
  if (!confirmDelete) {
    return;
  }
  let listings =
    JSON.parse(
      localStorage.getItem("ojewaListings")
    ) || [];
  listings =
    listings.filter(function(item) {
      return item.id != id;
    });
  localStorage.setItem(
    "ojewaListings",
    JSON.stringify(listings)
  );
  alert(
    "Listing deleted successfully."
  );
  location.reload();
}
/* =========================
   EDIT LISTING
========================= */
function editListing(id) {
  window.location.href =
    "sell.html?edit=" +
    encodeURIComponent(id);
}
/* =========================
   LOAD PAGE
========================= */
loadListings();
</script>
<a
  href="account.html"
  class="back"
>
  ← Back to Account
</a>
</body>
</html>
