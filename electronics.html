<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OJEWA - Electronics</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }
    header {
      background: #0b6b3a;
      color: white;
      padding: 20px;
      text-align: center;
    }
    header h1 {
      margin: 0;
    }
    header h1 {
      margin: 0;
    }
    .back {
      display: block;
      margin: 15px;
      color: #0b6b3a;
      text-decoration: none;
      font-weight: bold;
    }
    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 15px;
      padding: 15px;
    }
    .product {
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      text-align: center;
    }
    .pic {
      width: 100%;
      height: 150px;
      background: #eeeeee;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .pic img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .product h3 {
      margin: 8px 0;
    }
    .price {
      color: #0b6b3a;
      font-weight: bold;
      font-size: 18px;
    }
    .location {
      color: #666;
    }
  </style>
</head>
<body>
<header>
  <h1>📺 Electronics</h1>
  <p>Find electronics and appliances on OJEWA</p>
</header>
<a class="back" href="categories.html">← Back to Categories</a>
<section class="products">
  <div class="product">
    <div class="pic">
      <img src="https://images.unsplash.com/photo-1593359677879-a4bb92f829d1?auto=format&fit=crop&w=600&q=80" alt="Smart TV">
    </div>
    <h3>Smart TV</h3>
    <p class="price">GH₵ 3,000</p>
    <p>New</p>
    <p class="location">📍 Accra</p>
  </div>
  <div class="product">
    <div class="pic">
      <img src="https://images.unsplash.com/photo-1608043152269-423dbba4e7e1?auto=format&fit=crop&w=600&q=80" alt="Speaker">
    </div>
    <h3>Bluetooth Speaker</h3>
    <p class="price">GH₵ 850</p>
    <p>New</p>
    <p class="location">📍 Tema</p>
  </div>
  <div class="product">
    <div class="pic">
      <img src="https://images.unsplash.com/photo-1586023492125-27b2c045efd7?auto=format&fit=crop&w=600&q=80" alt="Home Appliance">
    </div>
    <h3>Home Appliance</h3>
    <p class="price">GH₵ 1,200</p>
    <p>New</p>
    <p class="location">📍 Kumasi</p>
  </div>
  <div class="product">
    <div class="pic">
      <img src="https://images.unsplash.com/photo-1574269909862-7e1d70bb8078?auto=format&fit=crop&w=600&q=80" alt="Microwave">
    </div>
    <h3>Microwave Oven</h3>
    <p class="price">GH₵ 1,500</p>
    <p>Used</p>
    <p class="location">📍 Accra</p>
  </div>
</section>
</body>
</html>
