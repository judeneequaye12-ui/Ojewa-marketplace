<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>OJEWA - Sell an Item</title>

<style>

body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f5f5f5;
}

header {
  background: #0b6b3a;
  color: white;
  padding: 20px;
  text-align: center;
}

.sell-form {
  background: white;
  margin: 20px;
  padding: 25px;
  border-radius: 10px;
}

.sell-form h2 {
  text-align: center;
}

.sell-form label {
  display: block;
  margin-top: 15px;
  font-weight: bold;
}

.sell-form input,
.sell-form select,
.sell-form textarea {
  width: 100%;
  padding: 12px;
  margin-top: 6px;
  box-sizing: border-box;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-size: 15px;
}

.sell-form input[type="file"] {
  background: #f8faf8;
  padding: 10px;
}

.photo-note {
  font-size: 13px;
  color: #666;
  margin-top: 6px;
}

.preview {
  width: 100%;
  max-height: 220px;
  object-fit: contain;
  margin-top: 12px;
  border-radius: 10px;
  display: none;
  background: #eef5ef;
}

.sell-form button {
  width: 100%;
  padding: 14px;
  margin-top: 20px;
  background: #0b6b3a;
  color: white;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  font-size: 16px;
}

.back {
  display: block;
  text-align: center;
  margin-top: 15px;
  color: #0b6b3a;
  text-decoration: none;
}

</style>

</head>

<body>

<header>

  <h1>OJEWA</h1>

  <p>Sell an Item</p>

</header>


<div class="sell-form">

  <h2>Post Your Item</h2>


  <label>Product Name</label>

  <input
    type="text"
    id="productName"
    placeholder="e.g. iPhone 14"
  >


  <label>Price</label>

  <input
    type="text"
    id="productPrice"
    placeholder="e.g. GH₵ 3,500"
  >


  <label>Category</label>

  <select id="productCategory">

    <option>Phones & Tablets</option>

    <option>Computers</option>

    <option>Cars & Vehicles</option>

    <option>Tyres & Wheels</option>

    <option>Property</option>

    <option>Fashion</option>

    <option>Home & Living</option>

    <option>Electronics</option>

    <option>Jobs & Services</option>

    <option>Other</option>

  </select>


  <label>Location</label>

  <input
    type="text"
    id="productLocation"
    placeholder="e.g. Accra"
  >


  <label>Product Photo</label>

  <input
    type="file"
    id="productImage"
    accept="image/*"
  >

  <p class="photo-note">
    Add a clear photo of the item you're selling.
  </p>


  <img
    id="preview"
    class="preview"
    alt="Photo preview"
  >


  <label>Description</label>

  <textarea
    id="productDescription"
    rows="5"
    placeholder="Describe your item"
  ></textarea>


  <button onclick="postItem()">
    Post Item
  </button>


  <a href="index.html" class="back">
    ← Back to OJEWA
  </a>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>


/* =========================
   PHOTO PREVIEW
========================= */

const imageInput =
  document.getElementById("productImage");

const preview =
  document.getElementById("preview");
/* =========================
   EDIT LISTING MODE
========================= */

const editId =
  new URLSearchParams(window.location.search)
    .get("edit");

let editingListing = null;

if (editId) {

  const listings =
    JSON.parse(
      localStorage.getItem("ojewaListings")
    ) || [];

  editingListing =
    listings.find(function(item) {
      return String(item.id) === String(editId);
    });

  if (editingListing) {

    document.getElementById("productName").value =
      editingListing.name || "";

    document.getElementById("productPrice").value =
      editingListing.price || "";

    document.getElementById("productCategory").value =
      editingListing.category || "Phones & Tablets";

    document.getElementById("productLocation").value =
      editingListing.location || "";

    document.getElementById("productDescription").value =
      editingListing.description || "";

    if (editingListing.image) {

      preview.src = editingListing.image;

      preview.style.display = "block";

    }

    document.querySelector(".sell-form h2").textContent =
      "Edit Your Listing";

    document.querySelector(".sell-form button").textContent =
      "Update Listing";

  }

}

imageInput.addEventListener("change", function() {

  const file = imageInput.files[0];

  if (!file) {

    preview.style.display = "none";

    return;
  }


  const reader = new FileReader();


  reader.onload = function(event) {

    preview.src = event.target.result;

    preview.style.display = "block";

  };


  reader.readAsDataURL(file);

});


/* =========================
   COMPRESS IMAGE
========================= */

function compressImage(file, maxSize = 800, quality = 0.6) {

  return new Promise(function(resolve, reject) {

    const reader = new FileReader();


    reader.onload = function(event) {

      const img = new Image();


      img.onload = function() {

        let width = img.width;

        let height = img.height;


        if (width > height) {

          if (width > maxSize) {

            height =
              height * (maxSize / width);

            width = maxSize;

          }

        } else {

          if (height > maxSize) {

            width =
              width * (maxSize / height);

            height = maxSize;

          }

        }


        const canvas =
          document.createElement("canvas");


        canvas.width = Math.round(width);

        canvas.height = Math.round(height);


        const ctx =
          canvas.getContext("2d");


        ctx.drawImage(
          img,
          0,
          0,
          canvas.width,
          canvas.height
        );


        const compressed =
          canvas.toDataURL(
            "image/jpeg",
            quality
          );


        resolve(compressed);

      };


      img.onerror = function() {

        reject(
          new Error("Image could not be processed.")
        );

      };


      img.src = event.target.result;

    };


    reader.onerror = function() {

      reject(
        new Error("Image could not be read.")
      );

    };


    reader.readAsDataURL(file);

  });

}


/* =========================
   COMPRESS OLD LISTING IMAGES
========================= */

async function compressOldListings(listings) {

  const updatedListings = [];


  for (const item of listings) {

    const copy = { ...item };


    if (
      copy.image &&
      typeof copy.image === "string" &&
      copy.image.startsWith("data:image/")
    ) {

      try {

        const blob =
          await fetch(copy.image)
            .then(function(response) {
              return response.blob();
            });


        copy.image =
          await compressImage(
            blob,
            700,
            0.5
          );

      } catch (error) {

        console.log(
          "Could not compress old image:",
          error
        );

      }

    }


    updatedListings.push(copy);

  }


  return updatedListings;

}


/* =========================
   POST ITEM
========================= */

async function postItem() {

  const name =
    document
      .getElementById("productName")
      .value
      .trim();


  const price =
    document
      .getElementById("productPrice")
      .value
      .trim();


  const category =
    document
      .getElementById("productCategory")
      .value;


  const location =
    document
      .getElementById("productLocation")
      .value
      .trim();


  const description =
    document
      .getElementById("productDescription")
      .value
      .trim();


  const imageFile =
    document
      .getElementById("productImage")
      .files[0];


  /* =========================
     VALIDATION
  ========================= */

  if (
  !name ||
  !price ||
  !location ||
  !description
) {

  alert(
    "Please fill in all the details."
  );

  return;

}


if (!imageFile && !editingListing) {

  alert(
    "Please add a photo of your item."
  );

  return;

}


  /* =========================
     POSTING MESSAGE
  ========================= */

  alert(
    "Posting your item..."
  );


  try {

    /* =========================
       GET EXISTING LISTINGS
    ========================= */

    let listings =
      JSON.parse(
        localStorage.getItem(
          "ojewaListings"
        )
      ) || [];


    /* =========================
       COMPRESS EXISTING PHOTOS
    ========================= */

    listings =
      await compressOldListings(
        listings
      );


    /* =========================
   EDIT EXISTING LISTING
========================= */

if (editingListing) {

  const listingIndex =
    listings.findIndex(function(item) {
      return String(item.id) === String(editId);
    });


  if (listingIndex === -1) {

    alert(
      "Listing could not be found."
    );

    return;

  }


  let updatedImage =
    listings[listingIndex].image || "";


  if (imageFile) {

    updatedImage =
      await compressImage(
        imageFile,
        800,
        0.6
      );

  }


  listings[listingIndex] = {

    ...listings[listingIndex],

    name: name,

    price: price,

    category: category,

    location: location,

    description: description,

    image: updatedImage

  };


} else {

  /* =========================
     COMPRESS NEW PHOTO
  ========================= */

  const compressedImage =
    await compressImage(
      imageFile,
      800,
      0.6
    );


  /* =========================
     CREATE NEW LISTING
  ========================= */



const supabaseClient = window.supabase.createClient(
  "https://ywzybrglgwyxewuyfpil.supabase.co",
  "sb_publishable_d_ijgSVbgDi9MnkPtXuJcQ_5GcjKp1T"
);

const { data: { user } } = await supabaseClient.auth.getUser();

const listing = {
  id: Date.now(),
  name: name,
  price: price,
  category: category,
  location: location,
  description: description,
  image: compressedImage,
  date: new Date().toLocaleDateString(),
  userId: user ? user.id : null
};


  listings.push(listing);

}


    /* =========================
       SAVE LISTINGS
    ========================= */

    const newListingsData =
      JSON.stringify(listings);


    const oldListingsData =
      localStorage.getItem(
        "ojewaListings"
      );


    try {

      localStorage.setItem(
        "ojewaListings",
        newListingsData
      );

    } catch (storageError) {

      /* =========================
         STORAGE FULL
      ========================= */

      if (
        storageError.name ===
        "QuotaExceededError"
      ) {

        alert(
          "OJEWA storage is full. Your existing listings are still safe. Please try posting with a smaller photo."
        );

        return;

      }

      throw storageError;

    }


    /* =========================
   CREATE NOTIFICATION
========================= */

let notifications =
  JSON.parse(
    localStorage.getItem(
      "ojewaNotifications"
    )
  ) || [];


notifications.unshift({

  id: Date.now(),

  type: "listings",

  icon: "📋",

  title:
    editingListing
      ? "Your listing was updated!"
      : "Your listing is now live!",

  text:
    editingListing
      ? name +
        " has been successfully updated on OJEWA."
      : name +
        " has been successfully posted on OJEWA.",

  date:
    new Date().toLocaleTimeString(
      [],
      {
        hour: "2-digit",
        minute: "2-digit"
      }
    ),

  read: false

});


localStorage.setItem(
  "ojewaNotifications",
  JSON.stringify(
    notifications
  )
);


    
/* =========================
   SUCCESS
========================= */

if (editingListing) {

  alert(
    "Your listing has been updated successfully! 🎉"
  );

} else {

  alert(
    "Your item has been posted to OJEWA! 🎉"
  );

}


window.location.href =
  "listings.html";

  } catch (error) {

    console.error(
      "OJEWA posting error:",
      error
    );


    alert(
      "Unable to post this item. Please try again with a smaller photo."
    );

  }

}

</script>

</body>

</html>
