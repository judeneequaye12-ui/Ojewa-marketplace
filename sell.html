<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>OJEWA - Sell an Item</title>

<style>

body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f5f5f5;
}

header {
  background: #0b6b3a;
  color: white;
  padding: 20px;
  text-align: center;
}

header h1 {
  margin: 0;
}

header p {
  margin: 8px 0 0;
}

.sell-form {
  background: white;
  margin: 20px;
  padding: 25px;
  border-radius: 10px;
}

.sell-form h2 {
  text-align: center;
}

.sell-form label {
  display: block;
  margin-top: 15px;
  font-weight: bold;
}

.sell-form input,
.sell-form select,
.sell-form textarea {
  width: 100%;
  padding: 12px;
  margin-top: 6px;
  box-sizing: border-box;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-size: 15px;
}

.sell-form input[type="file"] {
  background: #f8faf8;
  padding: 10px;
}

.photo-note {
  font-size: 13px;
  color: #666;
  margin-top: 6px;
}

.preview {
  width: 100%;
  max-height: 220px;
  object-fit: contain;
  margin-top: 12px;
  border-radius: 10px;
  display: none;
  background: #eef5ef;
}

.sell-form button {
  width: 100%;
  padding: 14px;
  margin-top: 20px;
  background: #0b6b3a;
  color: white;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  font-size: 16px;
  cursor: pointer;
}

.sell-form button:disabled {
  background: #777;
}

.back {
  display: block;
  text-align: center;
  margin-top: 15px;
  color: #0b6b3a;
  text-decoration: none;
}

</style>

</head>

<body>

<header>

  <h1>OJEWA</h1>

  <p>Sell an Item</p>

</header>


<div class="sell-form">

  <h2>Post Your Item</h2>


  <label>Product Name</label>

  <input
    type="text"
    id="productName"
    placeholder="e.g. iPhone 14"
  >


  <label>Price</label>

  <input
    type="text"
    id="productPrice"
    placeholder="e.g. GH₵ 3,500"
  >


  <label>Category</label>

  <select id="productCategory">

    <option>Phones & Tablets</option>

    <option>Computers</option>

    <option>Cars & Vehicles</option>

    <option>Tyres & Wheels</option>

    <option>Property</option>

    <option>Fashion</option>

    <option>Home & Living</option>

    <option>Electronics</option>

    <option>Jobs & Services</option>

    <option>Other</option>

  </select>


  <label>Location</label>

  <input
    type="text"
    id="productLocation"
    placeholder="e.g. Accra"
  >


  <label>Product Photo</label>

  <input
    type="file"
    id="productImage"
    accept="image/*"
  >

  <p class="photo-note">
    Add a clear photo of the item you're selling.
  </p>


  <img
    id="preview"
    class="preview"
    alt="Photo preview"
  >


  <label>Description</label>

  <textarea
    id="productDescription"
    rows="5"
    placeholder="Describe your item"
  ></textarea>


  <button
    id="postButton"
    type="button"
    onclick="postItem()"
  >
    Post Item
  </button>


  <a href="index.html" class="back">
    ← Back to OJEWA
  </a>

</div>


<script>


/* =========================
   PHOTO PREVIEW
========================= */

const imageInput =
  document.getElementById("productImage");

const preview =
  document.getElementById("preview");


imageInput.addEventListener("change", function() {

  const file = imageInput.files[0];

  if (!file) {

    preview.src = "";

    preview.style.display = "none";

    return;
  }


  const reader = new FileReader();


  reader.onload = function(event) {

    preview.src = event.target.result;

    preview.style.display = "block";

  };


  reader.readAsDataURL(file);

});


/* =========================
   COMPRESS PHOTO
========================= */

function compressImage(file, callback) {

  const reader = new FileReader();


  reader.onload = function(event) {

    const img = new Image();


    img.onload = function() {

      const maxSize = 1000;

      let width = img.width;

      let height = img.height;


      if (width > height) {

        if (width > maxSize) {

          height =
            Math.round(
              height * maxSize / width
            );

          width = maxSize;

        }

      } else {

        if (height > maxSize) {

          width =
            Math.round(
              width * maxSize / height
            );

          height = maxSize;

        }

      }


      const canvas =
        document.createElement("canvas");


      canvas.width = width;

      canvas.height = height;


      const ctx =
        canvas.getContext("2d");


      ctx.drawImage(
        img,
        0,
        0,
        width,
        height
      );


      const compressedImage =
        canvas.toDataURL(
          "image/jpeg",
          0.7
        );


      callback(compressedImage);

    };


    img.onerror = function() {

      callback(null);

    };


    img.src = event.target.result;

  };


  reader.onerror = function() {

    callback(null);

  };


  reader.readAsDataURL(file);

}


/* =========================
   POST ITEM
========================= */

function postItem() {

  const name =
    document.getElementById("productName").value.trim();

  const price =
    document.getElementById("productPrice").value.trim();

  const category =
    document.getElementById("productCategory").value;

  const location =
    document.getElementById("productLocation").value.trim();

  const description =
    document.getElementById("productDescription").value.trim();

  const imageFile =
    document.getElementById("productImage").files[0];

  const postButton =
    document.getElementById("postButton");


  /* CHECK DETAILS */

  if (
    !name ||
    !price ||
    !location ||
    !description
  ) {

    alert(
      "Please fill in all the details."
    );

    return;
  }


  /* CHECK PHOTO */

  if (!imageFile) {

    alert(
      "Please add a photo of your item."
    );

    return;
  }


  /* PREVENT DOUBLE POST */

  postButton.disabled = true;

  postButton.textContent =
    "Posting...";


  /* COMPRESS PHOTO BEFORE SAVING */

  compressImage(
    imageFile,
    function(compressedImage) {

      if (!compressedImage) {

        alert(
          "The photo could not be processed. Please choose another photo."
        );

        postButton.disabled = false;

        postButton.textContent =
          "Post Item";

        return;
      }


      try {


        /* =========================
           CREATE LISTING
        ========================= */

        const listing = {

          id: Date.now(),

          name: name,

          price: price,

          category: category,

          location: location,

          description: description,

          image: compressedImage,

          date:
            new Date().toLocaleDateString()

        };


        /* =========================
           GET LISTINGS
        ========================= */

        let listings = [];

        try {

          listings =
            JSON.parse(
              localStorage.getItem(
                "ojewaListings"
              )
            ) || [];

        } catch (error) {

          listings = [];

        }


        /* =========================
           SAVE LISTING
        ========================= */

        listings.push(listing);


        localStorage.setItem(
          "ojewaListings",
          JSON.stringify(listings)
        );


        /* =========================
           CREATE NOTIFICATION
        ========================= */

        let notifications = [];

        try {

          notifications =
            JSON.parse(
              localStorage.getItem(
                "ojewaNotifications"
              )
            ) || [];

        } catch (error) {

          notifications = [];

        }


        notifications.unshift({

          id: Date.now(),

          type: "listings",

          icon: "📋",

          title:
            "Your listing is now live!",

          text:
            name +
            " has been successfully posted on OJEWA.",

          date:
            new Date().toLocaleTimeString(
              [],
              {
                hour: "2-digit",
                minute: "2-digit"
              }
            ),

          read: false

        });


        localStorage.setItem(
          "ojewaNotifications",
          JSON.stringify(
            notifications
          )
        );


        /* =========================
           SUCCESS
        ========================= */

        alert(
          "Your item has been posted to OJEWA! 🎉"
        );


        /* =========================
           OPEN MY LISTINGS
        ========================= */

        window.location.href =
          "listings.html";


      } catch (error) {

        console.error(error);

        alert(
          "Something went wrong while posting your item. Please try again."
        );

        postButton.disabled = false;

        postButton.textContent =
          "Post Item";

      }

    }
  );

}

</script>

</body>

</html>
